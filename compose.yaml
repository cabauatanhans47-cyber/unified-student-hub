services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studenthub
      POSTGRES_USER: studenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - hub-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studenthub -d studenthub"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://studenthub:${POSTGRES_PASSWORD}@db:5432/studenthub
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      LMS_ALLOWED_HOSTS: ${LMS_ALLOWED_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  hub-data:
