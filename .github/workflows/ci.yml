name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studenthub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: studenthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studenthub -d studenthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - name: Install test browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Test student beta with PostgreSQL in desktop and mobile browser
        env:
          DATABASE_URL: postgresql://studenthub:ci-only-password@127.0.0.1:5432/studenthub_test
          COOKIE_SECURE: 'false'
        run: |
          uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/student-hub-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/health
          cd frontend
          node tests/beta-smoke.cjs
          node tests/study-smoke.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-beta-screenshots
          path: frontend/test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
